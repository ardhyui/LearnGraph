name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Local CI only: PGlite (no DATABASE_URL) and a throwaway, non-secret auth key.
      BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef0123456789
      BETTER_AUTH_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test (dev server + PGlite)
        run: |
          npm run dev > dev.log 2>&1 &
          npx --yes wait-on@8 -t 180000 http-get://127.0.0.1:8080/sign-in
          npm run smoke
      - name: Dev server log
        if: failure()
        run: cat dev.log || true
